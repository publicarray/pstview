name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # pstview.exe (GUI) + pstx.exe
          - os: windows-latest
            platform: windows
          # pstx, static (musl) so it runs on any distribution
          - os: ubuntu-latest
            platform: linux
          # pstx; built natively for the SDK (libiconv)
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Unit tests
        run: zig build test

      - name: Build (ReleaseSafe)
        run: |
          case "${{ matrix.platform }}" in
            windows) zig build -Drelease ;;
            linux)   zig build -Drelease -Dtarget=x86_64-linux-musl
                     zig build -Drelease -Dtarget=aarch64-linux-musl --prefix zig-out-arm64 ;;
            macos)   zig build -Drelease
                     zig build -Drelease -Dtarget=x86_64-macos --prefix zig-out-x64 ;;
          esac

      - name: Same output on every platform (demo mailbox, UTC)
        run: TZ=UTC bash testdata/smoke.sh zig-out/bin/pstx > smoke-${{ matrix.platform }}.txt

      - name: Local time matches Windows (Australia/Sydney)
        if: matrix.platform != 'windows'
        run: TZ=Australia/Sydney bash testdata/smoke.sh zig-out/bin/pstx | diff -u testdata/smoke-sydney.txt -

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke-${{ matrix.platform }}.txt

      - name: Package
        run: |
          ver=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA:0:7}")
          mkdir -p dist
          pack() { # pack <name> <files...>: zip on Windows, tar.gz elsewhere
            local name="pstview-$ver-$1"; shift
            mkdir -p "stage/$name" && cp "$@" README.md "stage/$name/"
            if [ "${{ matrix.platform }}" = windows ]; then
              (cd stage && 7z a -tzip "../dist/$name.zip" "$name" > /dev/null)
            else
              tar -C stage -czf "dist/$name.tar.gz" "$name"
            fi
          }
          case "${{ matrix.platform }}" in
            windows) pack windows-x64 zig-out/bin/pstview.exe zig-out/bin/pstx.exe ;;
            linux)   pack linux-x64 zig-out/bin/pstx; pack linux-arm64 zig-out-arm64/bin/pstx ;;
            macos)   pack macos-arm64 zig-out/bin/pstx; pack macos-x64 zig-out-x64/bin/pstx ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pstview-${{ matrix.platform }}
          path: dist/*

  # pstx must print the same thing on Windows, macOS and Linux
  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          merge-multiple: true
      - name: Compare
        run: |
          diff -u smoke-windows.txt smoke-linux.txt
          diff -u smoke-windows.txt smoke-macos.txt
          echo "identical on all platforms ($(wc -l < smoke-windows.txt) lines)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, compare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pstview-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "pstview $GITHUB_REF_NAME" \
            --generate-notes
