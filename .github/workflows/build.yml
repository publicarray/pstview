name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (ReleaseSafe)
        run: zig build -Drelease

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "pstview-$env:GITHUB_REF_NAME-windows-x64" } else { "pstview-$($env:GITHUB_SHA.Substring(0,7))-windows-x64" }
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item zig-out/bin/pstview.exe, zig-out/bin/pstx.exe, README.md dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          $files = @(Get-Item dist/$name/pstview.exe, dist/$name/pstx.exe, dist/$name.zip)
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          "PKG_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            dist/${{ env.PKG_NAME }}.zip
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "pstview $GITHUB_REF_NAME" \
            --generate-notes
