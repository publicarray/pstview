name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # pstview.exe (Win32 window + WebView2) + pstx.exe
          - os: windows-latest
            platform: windows
          # pstx static (musl), so it runs on any distribution; pstview (GTK 4 + WebKitGTK 6.0, loaded
          # at run time) against glibc
          - os: ubuntu-latest
            platform: linux
          # pstview.app (Cocoa + WKWebView) + pstx, arm64 and x64
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Unit tests
        run: zig build test

      - name: Build (ReleaseSafe)
        run: |
          case "${{ matrix.platform }}" in
            windows) zig build -Drelease ;;
            linux)   zig build -Drelease -Dtarget=x86_64-linux-musl
                     zig build -Drelease -Dtarget=aarch64-linux-musl --prefix zig-out-arm64
                     zig build -Drelease -Dtarget=x86_64-linux-gnu --prefix zig-out-gui
                     zig build -Drelease -Dtarget=aarch64-linux-gnu --prefix zig-out-gui-arm64 ;;
            macos)   zig build -Drelease
                     zig build -Drelease -Dtarget=x86_64-macos --prefix zig-out-x64 ;;
          esac

      - name: Same output on every platform (demo mailbox, UTC)
        run: TZ=UTC bash testdata/smoke.sh zig-out/bin/pstx > smoke-${{ matrix.platform }}.txt

      - name: Local time matches Windows (Australia/Sydney)
        if: matrix.platform != 'windows'
        run: TZ=Australia/Sydney bash testdata/smoke.sh zig-out/bin/pstx | diff -u testdata/smoke-sydney.txt -

      # The GUI opens the demo mailbox, lists a folder, renders a message in the system web view
      # (sandboxed frame), opens it in a window of its own, searches and sorts, then exits 0.
      - name: GUI self-test (Windows, WebView2)
        if: matrix.platform == 'windows'
        run: |
          timeout 180 zig-out/bin/pstview.exe --selftest testdata/demo-mailbox
          # the page's own menus, status bar and dialogs
          PSTVIEW_NATIVE=0 timeout 180 zig-out/bin/pstview.exe --selftest testdata/demo-mailbox

      - name: Install and uninstall for the user (Linux, scratch home)
        if: matrix.platform == 'linux'
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME=
          mkdir -p "$HOME" stage-install
          cp zig-out-gui/bin/pstview zig-out/bin/pstx stage-install/
          stage-install/pstview --install
          test -x "$HOME/.local/bin/pstview" -a -x "$HOME/.local/bin/pstx"
          grep -q "^Exec=\"$HOME/.local/bin/pstview\" %F" "$HOME/.local/share/applications/pstview.desktop"
          test -s "$HOME/.local/share/icons/hicolor/256x256/apps/pstview.png"
          "$HOME/.local/bin/pstview" --uninstall
          test ! -e "$HOME/.local/bin/pstview" -a ! -e "$HOME/.local/share/applications/pstview.desktop"

      - name: GUI self-test (Linux, GTK 4 + WebKitGTK 6.0 under Xvfb)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libwebkitgtk-6.0-4 xvfb xauth
          # WebKit starts its web process in a bubblewrap sandbox, which needs unprivileged user
          # namespaces; Ubuntu 24.04 runners restrict them by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          timeout 180 xvfb-run -a zig-out-gui/bin/pstview --selftest testdata/demo-mailbox
          # the page's own menus, status bar and dialogs, as Windows and macOS show them
          PSTVIEW_NATIVE=0 timeout 180 xvfb-run -a zig-out-gui/bin/pstview --selftest testdata/demo-mailbox

      - name: GUI self-test (macOS, Cocoa + WKWebView)
        if: matrix.platform == 'macos'
        run: |
          perl -e 'alarm 180; exec @ARGV' zig-out/bin/pstview --selftest testdata/demo-mailbox
          # the page's own menus, status line and dialogs
          PSTVIEW_NATIVE=0 perl -e 'alarm 180; exec @ARGV' zig-out/bin/pstview --selftest testdata/demo-mailbox

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke-${{ matrix.platform }}.txt

      - name: Package
        run: |
          ver=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA:0:7}")
          mkdir -p dist
          pack() { # pack <name> <files...>: zip on Windows, tar.gz elsewhere
            local name="pstview-$ver-$1"; shift
            mkdir -p "stage/$name" && cp -R "$@" README.md "stage/$name/"
            if [ "${{ matrix.platform }}" = windows ]; then
              (cd stage && 7z a -tzip "../dist/$name.zip" "$name" > /dev/null)
            else
              tar -C stage -czf "dist/$name.tar.gz" "$name"
            fi
          }
          linux_files="packaging/linux/pstview.desktop"
          cp design/icon-256.png pstview.png
          case "${{ matrix.platform }}" in
            windows) pack windows-x64 zig-out/bin/pstview.exe zig-out/bin/pstx.exe ;;
            linux)   pack linux-x64 zig-out-gui/bin/pstview zig-out/bin/pstx pstview.png $linux_files
                     pack linux-arm64 zig-out-gui-arm64/bin/pstview zig-out-arm64/bin/pstx pstview.png $linux_files ;;
            macos)   plain=${ver#v}
                     sh packaging/macos/make-app.sh zig-out/bin "$plain" app-arm64
                     sh packaging/macos/make-app.sh zig-out-x64/bin "$plain" app-x64
                     pack macos-arm64 app-arm64/pstview.app zig-out/bin/pstx
                     pack macos-x64 app-x64/pstview.app zig-out-x64/bin/pstx ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pstview-${{ matrix.platform }}
          path: dist/*

      # the glibc builds of pstview and pstx, for the AppImage and Flatpak jobs
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: linux-gui-bin
          path: |
            zig-out-gui/bin/
            zig-out-gui-arm64/bin/

  # One-file AppImages (x86_64, aarch64) of the same binaries. Like the release archive they use
  # the system's GTK 4 and WebKitGTK 6.0; the x86_64 one runs the GUI self-test.
  appimage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: linux-gui-bin
          path: bins
      - name: Build the AppImages
        env:
          APPIMAGETOOL_VERSION: 1.9.1
          # runners have no FUSE: AppImages (appimagetool's too) unpack and run instead
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ver=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA:0:7}")
          chmod +x bins/*/bin/*
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          export APPIMAGETOOL="$PWD/appimagetool"
          sh packaging/linux/make-appimage.sh bins/zig-out-gui/bin "$ver" x86_64 dist
          sh packaging/linux/make-appimage.sh bins/zig-out-gui-arm64/bin "$ver" aarch64 dist
          ls -l dist
      - name: GUI self-test of the AppImage (Xvfb)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libwebkitgtk-6.0-4 xvfb xauth
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          app=$(ls dist/*-x86_64.AppImage)
          "$app" pstx tree testdata/demo-mailbox
          timeout 180 xvfb-run -a "$app" --selftest testdata/demo-mailbox
      - uses: actions/upload-artifact@v4
        with:
          name: pstview-appimage
          path: dist/*.AppImage

  # A Flatpak bundle on the GNOME runtime (which has GTK 4 and WebKitGTK 6.0). Installing it
  # fetches the runtime from Flathub: flatpak install --user pstview-<version>-x86_64.flatpak
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: linux-gui-bin
          path: bins
      - name: Binaries for the manifest
        id: ver
        run: |
          mkdir -p packaging/flatpak/bin
          install -m755 bins/zig-out-gui/bin/pstview bins/zig-out-gui/bin/pstx packaging/flatpak/bin/
          echo "v=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA:0:7}")" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.publicarray.pstview.yml
          bundle: pstview-${{ steps.ver.outputs.v }}-x86_64.flatpak
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: pstview-flatpak
          path: pstview-*.flatpak

  # The web browser version: built, its model tested in Node, packed for the release, and (on a
  # release) published with GitHub Pages.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (ReleaseSafe)
        run: zig build web -Drelease
      - name: Test the model in WebAssembly (demo mailbox)
        run: node testdata/web-test.mjs zig-out/web/pstview.wasm testdata/demo-mailbox
      - name: Package
        run: |
          ver=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA:0:7}")
          mkdir -p dist stage
          cp -R zig-out/web "stage/pstview-$ver-web"
          (cd stage && zip -qr "../dist/pstview-$ver-web.zip" "pstview-$ver-web")
      - uses: actions/upload-artifact@v4
        with:
          name: pstview-web
          path: dist/*
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: zig-out/web

  # The web version of a release on GitHub Pages (Settings > Pages > Source: GitHub Actions).
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # pstx must print the same thing on Windows, macOS and Linux
  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          merge-multiple: true
      - name: Compare
        run: |
          diff -u smoke-windows.txt smoke-linux.txt
          diff -u smoke-windows.txt smoke-macos.txt
          echo "identical on all platforms ($(wc -l < smoke-windows.txt) lines)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, compare, appimage, flatpak, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pstview-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip *.tar.gz *.AppImage *.flatpak > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz *.AppImage *.flatpak SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "pstview $GITHUB_REF_NAME" \
            --generate-notes
